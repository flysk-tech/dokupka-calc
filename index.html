<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор докупки: виджеты и amoCRM</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#f8fafc;color:#0f172a;padding:24px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px}
.sub{color:#64748b;margin-bottom:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:16px}
label{display:block;font-size:13px;color:#475569;margin:0 0 6px;font-weight:600}
select,input[type=number],input[type=date]{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:640px){.grid,.grid3{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid #e2e8f0;background:#f1f5f9;cursor:pointer;font-weight:600;text-align:center;font-size:15px}
.tab.on{background:#0f172a;color:#fff;border-color:#0f172a}
.note{font-size:13px;color:#64748b;margin-top:8px}
.result{background:linear-gradient(90deg,#ead5ff,#bfdbfe);border-radius:16px;padding:22px;margin-bottom:16px}
.result .t{font-size:13px;color:#475569;text-transform:uppercase;letter-spacing:.04em}
.result .sum{font-size:40px;font-weight:800;margin:4px 0 10px}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-top:1px solid rgba(15,23,42,.1);font-size:14px}
.rows div b{text-align:right}
.rows div:first-child{border-top:0}
.err{color:#b91c1c;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:7px 8px;border-bottom:1px solid #e2e8f0;text-align:left}
th{color:#64748b;font-weight:600}
button.copy{margin-top:12px;padding:9px 14px;border-radius:10px;border:0;background:#0f172a;color:#fff;font-size:14px;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Калькулятор докупки</h1>
  <div class="sub">Расчёт доплаты за пользователей или продление срока: виджеты Flysk и лицензии amoCRM</div>

  <div class="tabs" id="productTabs">
    <div class="tab on" data-product="widgets">Виджеты Flysk</div>
    <div class="tab" data-product="amo">Лицензии amoCRM</div>
  </div>

  <div class="card">
    <b id="tariffTitle">Тариф для всех виджетов</b>
    <div id="planBox" class="hide" style="margin-top:12px">
      <label for="plan">Тариф amoCRM</label>
      <select id="plan"></select>
    </div>
    <div class="note" id="tariffNote" style="font-size:14px"></div>
  </div>

  <div class="tabs" id="modeTabs">
    <div class="tab on" data-mode="users">Докупить пользователей</div>
    <div class="tab" data-mode="term">Докупить срок</div>
  </div>

  <div class="card">
    <div class="grid3">
      <div>
        <label>Срок, на который куплен тариф</label>
        <select id="period"></select>
      </div>
      <div>
        <label>Дата начала (оплаты)</label>
        <input type="date" id="start">
      </div>
      <div>
        <label>Пользователей сейчас</label>
        <input type="number" id="users" min="5" value="12">
      </div>
    </div>
    <div class="grid" style="margin-top:14px">
      <div>
        <label>Сегодняшняя дата (дата докупки)</label>
        <input type="date" id="today">
      </div>
      <div id="addUsersBox">
        <label>Сколько пользователей добавить</label>
        <input type="number" id="add" min="1" value="1">
      </div>
      <div id="addTermBox" class="hide">
        <label>На какой срок продлить</label>
        <select id="extPeriod"></select>
      </div>
    </div>
  </div>

  <div class="result">
    <div class="t" id="resTitle">Доплатить</div>
    <div class="sum" id="resSum">—</div>
    <div class="rows" id="resRows"></div>
    <button class="copy" id="copyBtn">Скопировать расчёт</button>
  </div>

  <div class="card">
    <b>Тарифная сетка</b>
    <div class="note" id="gridNote"></div>
    <table id="tbl"></table>
  </div>
</div>

<script>
/* ===== НАСТРОЙКИ ТАРИФОВ: ВИДЖЕТЫ =====
   Каждая тарифная сетка описана один раз, виджеты ссылаются на неё.
   pricePerUserMonth — цена за пользователя в месяц
   periods: months — срок, paid — сколько месяцев оплачивается (остальное в подарок)
   Если у какого-то виджета будет другая сетка — добавьте новый объект в TARIFFS и привяжите виджет. */
const TARIFFS = {
  standard: {
    pricePerUserMonth: 99,
    minUsers: 5,
    periods: [
      {months: 1,  paid: 1},
      {months: 3,  paid: 3},
      {months: 7,  paid: 6},   // 1 месяц в подарок
      {months: 12, paid: 10},  // 2 месяца в подарок
      {months: 24, paid: 18}   // 6 месяцев в подарок
    ]
  }
};

/* ===== НАСТРОЙКИ ТАРИФОВ: amoCRM =====
   Цены в ₽ без НДС. Источник: amocrm.ru/buy и amocrm.ru/buy/archive (сверено 16.10.2026).
   AMO_PAID — сроки оплаты (месяцев), доступные при покупке (минимум полгода).
   AMO_BONUS — месяцы в подарок от amoCRM по сроку оплаты. Выведено из сетки на alarmcrm.ru/services/license
   (там указан итоговый бонус вместе с нашим +1) и сверено с сеткой партнёров; на публичных страницах amoCRM
   бонусы не показаны, актуальные видны в кабинете (Настройки → Счёт и оплата). При изменении акций правьте здесь.
   INTEGRATOR_BONUS — наш бонус интегратора, +1 месяц к бонусам amoCRM.
   Тариф: price — за пользователя в месяц; для пакетов base — цена пакета в месяц, included — сколько
   пользователей входит, price — цена каждого сверх пакета (null — докупить нельзя), yearly — годовой пакет. */
const AMO_PAID = [6, 8, 10, 12, 18, 24];
const AMO_BONUS = {6: 0, 8: 1, 10: 2, 12: 0, 18: 6, 24: 0};
const INTEGRATOR_BONUS = 1;

const NOW = 'действует';
const U = (g, name, price, from, to, o={}) => Object.assign({g, name, price, base:0, included:0, minUsers:1, maxUsers:Infinity, from, to}, o);
const PKG = (g, name, base, users, from, to, o={}) => {
  const r = Object.assign({g, name, price:null, base, included:users, minUsers:1, maxUsers:users, from, to}, o);
  if (r.price) r.maxUsers = Infinity;
  return r;
};
const YEAR = (g, name, priceYear, users, from, to, o={}) => PKG(g, name, priceYear/12, users, from, to, Object.assign({yearly:true}, o));
const ENT = 'Цена = тариф + опция Enterprise (цена опции в архиве указана отдельно).';

const G_NOW = 'Действующие тарифы';
const G_2526 = 'Архив: 01.09.2025 — 01.09.2026';
const G_2425 = 'Архив: 01.09.2024 — 01.09.2025';
const G_2124 = 'Архив: 01.06.2021 — 01.09.2024';
const G_1521 = 'Архив: 2015 — 01.06.2021';
const G_YEAR = 'Архив: годовые пакеты';
const G_OLD  = 'Архив: до 2015';

const AMO_PLANS = [
  U(G_NOW, 'Базовый', 599, '01.09.2024', NOW),
  U(G_NOW, 'Расширенный', 1299, '01.09.2026', NOW),
  U(G_NOW, 'Профессиональный', 1799, '01.09.2026', NOW),
  PKG(G_NOW, 'Enterprise Lite 50', 149999, 50, '01.09.2026', NOW, {price:2999, minUsers:50, note:'Пакет 149 999 ₽/мес за 50 пользователей, каждый следующий +2 999 ₽/мес.'}),
  PKG(G_NOW, 'Enterprise 200', 899999, 200, '01.09.2026', NOW, {price:4499, minUsers:200, note:'Пакет 899 999 ₽/мес за 200 пользователей, каждый следующий +4 499 ₽/мес.'}),
  YEAR(G_NOW, 'Микро-бизнес', 8999, 2, '01.09.2025', NOW, {note:'Годовой пакет 8 999 ₽/год, до 2 пользователей, докупить пользователей нельзя.'}),

  U(G_2526, 'Расширенный (1 199)', 1199, '01.09.2025', '01.09.2026'),
  U(G_2526, 'Профессиональный (1 699)', 1699, '01.09.2025', '01.09.2026'),
  U(G_2526, 'Enterprise Lite 50 (Проф. 1 699 + 900)', 2599, '01.09.2025', '01.09.2026', {minUsers:50, note:'От 50 пользователей. '+ENT}),
  U(G_2526, 'Enterprise 200 (Проф. 1 699 + 2 299)', 3998, '01.09.2025', '01.09.2026', {minUsers:200, note:'От 200 пользователей. '+ENT}),

  U(G_2425, 'Расширенный (1 099)', 1099, '01.09.2024', '01.09.2025'),
  U(G_2425, 'Профессиональный (1 599)', 1599, '01.09.2024', '01.09.2025'),
  U(G_2425, 'Enterprise (Проф. 1 599 + 1 500)', 3099, '01.09.2024', '01.09.2025', {minUsers:200, note:'От 200 пользователей. '+ENT}),
  U(G_2425, 'Enterprise Lite на Базовом (599 + 699)', 1298, '13.03.2025', '01.09.2025', {minUsers:30, note:'От 30 пользователей. '+ENT}),
  U(G_2425, 'Enterprise Lite на Расширенном (1 099 + 699)', 1798, '13.03.2025', '01.09.2025', {minUsers:30, note:'От 30 пользователей. '+ENT}),
  U(G_2425, 'Enterprise Lite на Профессиональном (1 599 + 699)', 2298, '13.03.2025', '01.09.2025', {minUsers:30, note:'От 30 пользователей. '+ENT}),

  U(G_2124, 'Базовый (499)', 499, '01.06.2021', '01.09.2024'),
  U(G_2124, 'Расширенный (999)', 999, '01.06.2021', '01.09.2024'),
  U(G_2124, 'Профессиональный (1 499)', 1499, '01.06.2021', '01.09.2024'),
  U(G_2124, 'Enterprise (2 999)', 2999, '28.04.2023', '01.09.2024', {note:'Лимиты тарифа Профессиональный, SSO, личный менеджер, SLA.'}),

  U(G_1521, 'Базовый (499, до 01.06.21)', 499, '18.03.2015', '01.06.2021'),
  U(G_1521, 'Расширенный (999, до 01.06.21)', 999, '09.04.2018', '01.06.2021'),
  U(G_1521, 'Профессиональный (1 499, до 01.06.21)', 1499, '18.03.2015', '01.06.2021'),
  U(G_1521, 'Расширенный (999, 2017–2018)', 999, '10.05.2017', '09.04.2018'),
  U(G_1521, 'Расширенный (799, 2015–2017)', 799, '07.04.2015', '09.05.2017'),

  YEAR(G_YEAR, 'Микро-Бизнес (4 999/год)', 4999, 2, '2015', '01.09.2024', {note:'Годовой пакет, до 2 пользователей.'}),
  YEAR(G_YEAR, 'Старт-ап (14 999/год)', 14999, 5, '2015', '01.09.2024', {note:'Годовой пакет, до 5 пользователей.'}),
  YEAR(G_YEAR, 'Микро-Бизнес (7 999/год)', 7999, 2, '01.09.2024', '01.09.2025', {note:'Годовой пакет, до 2 пользователей.'}),
  YEAR(G_YEAR, 'Старт-ап (19 999/год)', 19999, 5, '01.09.2024', '01.09.2025', {note:'Годовой пакет, до 5 пользователей.'}),

  U(G_OLD, 'Компания (499)', 499, '15.08.2014', '07.04.2015', {maxUsers:1, note:'Тариф на 1 пользователя.'}),
  U(G_OLD, 'Личный (350)', 350, '01.05.2010', '15.08.2014', {maxUsers:1, note:'Тариф на 1 пользователя.'}),
  U(G_OLD, 'Начальный (600)', 600, '01.05.2010', '15.08.2014', {maxUsers:1, note:'Тариф на 1 пользователя.'}),
  PKG(G_OLD, 'Оптимальный (1 500)', 1500, 10, '01.05.2010', '15.08.2014', {note:'Пакет до 10 пользователей.'}),
  PKG(G_OLD, 'Максимальный (3 000)', 3000, Infinity, '01.05.2010', '15.08.2014', {note:'Пользователи не ограничены.'})
];

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const iso = d => d.toISOString().slice(0,10);
let mode = 'users';
let product = 'widgets';

function monthWord(n){
  const a = n % 100, b = n % 10;
  if (a>10 && a<20) return 'месяцев';
  if (b===1) return 'месяц';
  if (b>=2 && b<=4) return 'месяца';
  return 'месяцев';
}
function periodLabel(p){
  if (p.label) return p.label;
  const g = p.months - p.paid;
  let s = p.months===12 ? '1 год' : p.months===24 ? '2 года' : p.months+' '+monthWord(p.months);
  if (g>0) s += ' (+'+g+' в подарок)';
  return s;
}
function amoPeriods(plan){
  if (plan.yearly) return [{months:12, paid:12, label:'1 год'}];
  return AMO_PAID.map(paid => {
    const amo = AMO_BONUS[paid] || 0, int = INTEGRATOR_BONUS;
    const parts = [];
    if (amo) parts.push('+'+amo+' amoCRM');
    if (int) parts.push('+'+int+' от нас');
    return {months: paid+amo+int, paid, amo, int,
      label: paid+' мес. оплаты → '+(paid+amo+int)+' мес.'+(parts.length ? ' ('+parts.join(', ')+')' : '')};
  });
}
function tariff(){
  if (product === 'widgets'){
    const w = TARIFFS.standard;
    return Object.assign({base:0, included:0, maxUsers:Infinity}, w);
  }
  const plan = AMO_PLANS[+$('plan').value] || AMO_PLANS[0];
  return Object.assign({}, plan, {pricePerUserMonth: plan.price, periods: amoPeriods(plan)});
}
/* стоимость подписки в месяц для users пользователей */
function monthly(t, users){
  return t.base + (t.pricePerUserMonth || 0) * Math.max(0, users - t.included);
}

function addMonths(d, m){
  const r = new Date(d.getFullYear(), d.getMonth()+m, d.getDate());
  // если день «перескочил» (31 января + 1 мес.), откатываем на последний день месяца
  if (r.getDate() !== d.getDate()) r.setDate(0);
  return r;
}
/* Остаток периода в месяцах: полные календарные месяцы + дни/30 */
function remainingMonths(from, to){
  if (to <= from) return {months:0, full:0, days:0};
  let full = 0;
  while (addMonths(from, full+1) <= to) full++;
  const days = Math.round((to - addMonths(from, full)) / 86400000);
  return {months: full + days/30, full, days};
}
function parseD(v){ const [y,m,d] = v.split('-').map(Number); return new Date(y, m-1, d); }
function dfmt(d){ return d.toLocaleDateString('ru-RU'); }

function fillPlans(){
  const groups = [];
  AMO_PLANS.forEach((p,i)=>{
    let g = groups.find(x=>x.name===p.g);
    if (!g){ g = {name:p.g, items:[]}; groups.push(g); }
    g.items.push(`<option value="${i}">${p.name} — ${p.price!==null && !p.yearly && p.base===0 ? p.price.toLocaleString('ru-RU')+' ₽/польз.' : p.yearly ? (p.base*12).toLocaleString('ru-RU')+' ₽/год' : p.base.toLocaleString('ru-RU')+' ₽/мес'}</option>`);
  });
  $('plan').innerHTML = groups.map(g=>`<optgroup label="${g.name}">${g.items.join('')}</optgroup>`).join('');
}

function fillSelects(reset){
  const t = tariff();
  const opts = t.periods.map((p,i)=>`<option value="${i}">${periodLabel(p)}</option>`).join('');
  const keepP = reset ? '' : $('period').value, keepE = reset ? '' : $('extPeriod').value;
  $('period').innerHTML = opts;
  $('extPeriod').innerHTML = opts;
  if (keepP) $('period').value = keepP;
  if (keepE) $('extPeriod').value = keepE;
  $('users').min = t.minUsers;
  if (isFinite(t.maxUsers)) $('users').max = t.maxUsers; else $('users').removeAttribute('max');
  if (reset){
    const u = +$('users').value;
    if (u < t.minUsers) $('users').value = t.minUsers;
    else if (u > t.maxUsers) $('users').value = t.maxUsers;
  }

  if (product === 'widgets'){
    $('tariffTitle').textContent = 'Тариф для всех виджетов';
    $('tariffNote').textContent = `${t.pricePerUserMonth} ₽ за пользователя в месяц, минимум ${t.minUsers} пользователей. Подарочные месяцы действуют при покупке на 7 месяцев, 1 год и 2 года.`;
    $('gridNote').textContent = '';
    $('tbl').innerHTML = '<tr><th>Срок</th><th>В подарок</th><th>За пользователя в мес.</th><th>За '+t.minUsers+' польз.</th></tr>' +
      t.periods.map(p=>{
        const total = t.pricePerUserMonth*p.paid*t.minUsers;
        return `<tr><td>${p.months} мес.</td><td>${p.months-p.paid>0?(p.months-p.paid)+' мес.':'—'}</td><td>${Math.round(t.pricePerUserMonth*p.paid/p.months)} ₽</td><td>${fmt(total)}</td></tr>`;
      }).join('');
  } else {
    const archived = t.to !== NOW;
    const price = t.yearly ? `${fmt(t.base*12)} в год` : (t.base>0 && t.included>0 ? `${fmt(t.base)} в месяц за ${isFinite(t.included)?t.included:'любое число'} польз.` : `${fmt(t.pricePerUserMonth)} за пользователя в месяц`);
    $('tariffTitle').textContent = 'Лицензия amoCRM: ' + t.name;
    $('tariffNote').textContent = `${price}, без НДС. Действовал: ${t.from} — ${t.to}.` + (t.note ? ' '+t.note : '') +
      (archived ? ' Архивный тариф: расчёт по старой цене; по какой цене amoCRM продлевает такой тариф, уточняйте в кабинете клиента.' : '');
    if (t.yearly){
      $('gridNote').textContent = 'Годовой пакет: бонусные месяцы не предусмотрены.';
      $('tbl').innerHTML = '<tr><th>Срок</th><th>Стоимость</th></tr><tr><td>1 год</td><td>'+fmt(t.base*12)+'</td></tr>';
    } else {
      const n = t.minUsers;
      $('gridNote').textContent = `Бонусы: месяцы в подарок от amoCRM + ${INTEGRATOR_BONUS} мес. от интегратора (от нас) к любому сроку. Расчёт на ${n} польз.`;
      $('tbl').innerHTML = '<tr><th>Оплата</th><th>Бонус amoCRM</th><th>Наш бонус</th><th>Всего мес.</th><th>За польз. в мес. (по факту)</th><th>Итого за '+n+' польз.</th></tr>' +
        t.periods.map(p=>{
          const total = monthly(t,n)*p.paid;
          return `<tr><td>${p.paid} мес.</td><td>${p.amo?'+'+p.amo+' мес.':'—'}</td><td>+${p.int} мес.</td><td>${p.months} мес.</td><td>${fmt(monthly(t,n)/n*p.paid/p.months)}</td><td>${fmt(total)}</td></tr>`;
        }).join('');
    }
  }
}

function calc(){
  const t = tariff();
  const p = t.periods[+$('period').value] || t.periods[0];
  const users = +$('users').value;
  const start = $('start').value && parseD($('start').value);
  const today = $('today').value && parseD($('today').value);
  const rows = [];
  const head = product === 'amo' ? 'amoCRM «'+t.name+'»\n' : '';
  const out = (title, sum, text) => {
    $('resTitle').textContent = title;
    $('resSum').innerHTML = sum;
    $('resRows').innerHTML = rows.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
    $('copyBtn').dataset.text = text ? head + text : '';
  };
  if (!start || !today){ out('Доплатить','—'); return; }
  if (users < t.minUsers){ out('Доплатить','<span class="err" style="font-size:18px">Минимум '+t.minUsers+' пользователей</span>'); return; }
  if (users > t.maxUsers){ out('Доплатить','<span class="err" style="font-size:18px">В тарифе максимум '+t.maxUsers+' пользователей</span>'); return; }

  const end = addMonths(start, p.months);
  const perMonth = monthly(t, users);
  const paidSum = perMonth * p.paid;
  const simple = t.base === 0 && t.included === 0;
  if (product === 'amo') rows.push(['Тариф', t.name]);
  rows.push(['Куплено', `${periodLabel(p)}, ${users} польз.`]);
  rows.push(['Оплачено', fmt(paidSum)]);
  rows.push(['Тариф действует', `${dfmt(start)} — ${dfmt(end)}`]);

  if (today < start){ out('Доплатить','<span class="err" style="font-size:18px">Дата докупки раньше даты начала</span>'); return; }
  if (today >= end){ out('Доплатить','<span class="err" style="font-size:18px">Тариф уже закончился — нужна новая покупка</span>'); return; }

  const rem = remainingMonths(today, end);
  rows.push(['Осталось до конца', `${rem.full} мес. ${rem.days} дн. (≈ ${rem.months.toFixed(2)} мес.)`]);

  if (mode === 'users'){
    const add = +$('add').value;
    if (!(add >= 1)){ out('Доплатить','—'); return; }
    if (users + add > t.maxUsers){ out('Доплатить','<span class="err" style="font-size:18px">Лимит тарифа — '+t.maxUsers+' польз., докупить нельзя</span>'); return; }
    // без бонусов: полная цена за пользователя в месяц × остаток месяцев
    const delta = monthly(t, users + add) - perMonth;
    const sum = Math.ceil(delta * rem.months);
    const formula = simple ? `${t.pricePerUserMonth} ₽ × ${add} польз. × ${rem.months.toFixed(2)} мес.` : `${fmt(delta)} в мес. × ${rem.months.toFixed(2)} мес.`;
    const formulaCopy = simple ? `${t.pricePerUserMonth} ₽ × ${add} × ${rem.months.toFixed(2)} мес.` : `${fmt(delta)} в мес. × ${rem.months.toFixed(2)} мес.`;
    rows.push(['Формула', formula]);
    rows.push(['Пользователей после докупки', users + add]);
    const text = `Докупка ${add} польз.\nТариф: ${periodLabel(p)}, ${users} польз., ${dfmt(start)} — ${dfmt(end)}.\nОстаток срока: ${rem.full} мес. ${rem.days} дн.\nДоплата: ${fmt(sum)} (${formulaCopy}, без бонусов). Итого пользователей: ${users+add}.`;
    out(`Доплатить за ${add} польз. до конца срока`, fmt(sum), text);
  } else {
    const ext = t.periods[+$('extPeriod').value] || t.periods[0];
    const sum = perMonth * ext.paid;
    const newEnd = addMonths(end, ext.months);
    rows.push(['Продление', `${periodLabel(ext)} для ${users} польз.`]);
    rows.push(['Новая дата окончания', dfmt(newEnd)]);
    rows.push(['Формула', simple ? `${t.pricePerUserMonth} ₽ × ${users} польз. × ${ext.paid} опл. мес.` : `${fmt(perMonth)} в мес. × ${ext.paid} опл. мес.`]);
    const text = `Продление на ${periodLabel(ext)} для ${users} польз.\nСейчас действует до ${dfmt(end)}, после продления — до ${dfmt(newEnd)}.\nК оплате: ${fmt(sum)}.`;
    out('К оплате за продление', fmt(sum), text);
  }
}

const now = new Date();
$('today').value = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()+0)).slice(0,10);
const s = new Date(now.getFullYear(), now.getMonth()-1, now.getDate());
$('start').value = `${s.getFullYear()}-${String(s.getMonth()+1).padStart(2,'0')}-${String(s.getDate()).padStart(2,'0')}`;
{ const n=now; $('today').value = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
fillPlans();
fillSelects(true);
$('period').value = 3; // 1 год по умолчанию

document.querySelectorAll('#modeTabs .tab').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('#modeTabs .tab').forEach(x=>x.classList.remove('on'));
  el.classList.add('on'); mode = el.dataset.mode;
  $('addUsersBox').classList.toggle('hide', mode!=='users');
  $('addTermBox').classList.toggle('hide', mode!=='term');
  calc();
});
function resetTariff(){
  fillSelects(true);
  if ($('period').options.length > 3) $('period').value = 3;
  calc();
}
document.querySelectorAll('#productTabs .tab').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('#productTabs .tab').forEach(x=>x.classList.remove('on'));
  el.classList.add('on'); product = el.dataset.product;
  $('planBox').classList.toggle('hide', product!=='amo');
  resetTariff();
});
$('plan').addEventListener('input', resetTariff);
['period','start','users','today','add','extPeriod'].forEach(id=>$(id).addEventListener('input',calc));
$('copyBtn').onclick = ()=>{
  const t = $('copyBtn').dataset.text; if(!t) return;
  navigator.clipboard.writeText(t).then(()=>{ $('copyBtn').textContent='Скопировано'; setTimeout(()=>$('copyBtn').textContent='Скопировать расчёт',1500); });
};
calc();
